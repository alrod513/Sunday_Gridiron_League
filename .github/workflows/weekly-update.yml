name: Update Projections

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the workflow to write files back to your repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run stats script
        run: python update_stats.py

      - name: Commit and push updated projections
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add updated_projections.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update projections JSON" && git push)
